[package]
name = "mtr-gui"
version = "0.1.0"
description = "Cross-platform MTR-style network diagnostic GUI"
edition = "2021"

[lib]
name = "mtr_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mtr-engine = { path = "../crates/engine" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
