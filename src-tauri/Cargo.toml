[package]
name = "mtr-gui"
version = "0.1.0"
description = "TraceLens: a cross-platform MTR-style network path diagnostic app"
edition = "2021"

[lib]
name = "mtr_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mtr-engine = { path = "../crates/engine" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
clap = { version = "4", features = ["derive"] }
